apiVersion: 2019-12-01
name: openclaw
type: Microsoft.ContainerInstance/containerGroups
properties:
  containers:
  - name: openclaw-gateway
      properties:
        image: reg84572.azurecr.io/openclaw:aoai
        volumeMounts:
        - name: openclaw-emptydir
          mountPath: /home/node/.openclaw
        resources:
          requests:
            cpu: 1
            memoryInGb: 1.5
        ports:
        - port: 18789
        - port: 18790
        command:
        - node
        - dist/index.js
        - gateway
        - --port
        - "18789"
  osType: Linux
  volumes:
  - name: openclaw-emptydir
    emptyDir: {}
  subnetIds:
  - id: ""
